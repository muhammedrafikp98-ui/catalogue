<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Urban Pots — Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --half-white:#200a03;
    --card-surface:#FBF8F2;
    --card-back-bg:#582a12;
    --terracotta:#3f170a;
    --terracotta-deep:#3a1206;
    --terracotta-pale:#EADACE;
    --ink:#2B2420;
    --ink-muted:#7A6C60;
    --line:rgba(43,36,32,0.12);
    --back-text:#FFFFFF;
    --back-text-muted:rgba(255,255,255,0.75);
    --back-line:rgba(255,255,255,0.25);
    --wa-green:#25D366;
    --wa-green-hover:#20ba5a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--half-white);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:0;
  }

  /* Header */
  .sticky-header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(32,10,3,0.92);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.1);
    padding:16px 20px;
  }
  .header-inner{
    max-width:1440px;
    margin:0 auto;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .brand-group{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand-title{
    font-family:'Fraunces',serif;
    font-size:24px;
    font-weight:500;
    color:var(--back-text);
    letter-spacing:-0.01em;
  }
  .brand-eyebrow{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--back-text-muted);
  }
  .search-wrap{
    position:relative;
    flex:1;
    max-width:340px;
    min-width:220px;
  }
  .search-input{
    width:100%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:999px;
    padding:8px 16px 8px 36px;
    font-size:13px;
    color:var(--back-text);
    outline:none;
    transition:all 0.2s;
  }
  .search-input::placeholder{color:var(--back-text-muted);}
  .search-input:focus{
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.4);
  }
  .search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--back-text-muted);
    font-size:13px;
    pointer-events:none;
  }
  .counter-badge{
    font-size:11.5px;
    color:var(--back-text-muted);
    font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,0.08);
    padding:5px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.12);
  }

  /* Main Container */
  .grid-stage{
    max-width:1440px;
    margin:0 auto;
    padding:24px 16px 80px;
  }

  /* 5-Column Grid on Desktop */
  .product-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:18px;
  }

  /* Card */
  .card-frame{
    width:100%;
    aspect-ratio:3/4.4;
    perspective:1600px;
    cursor:pointer;
    touch-action:pan-y;
  }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.7s cubic-bezier(0.22,1,0.36,1);
    transform-style:preserve-3d;
  }
  .card-frame.flipped .card-inner{transform:rotateY(180deg);}

  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:18px;
    overflow:hidden;
    background:var(--card-surface);
    border:1px solid var(--line);
    box-shadow:0 2px 8px rgba(0,0,0,0.15), 0 12px 32px rgba(0,0,0,0.2);
  }

  /* Front Face */
  .card-front{
    display:flex;
    flex-direction:column;
  }
  .photo-wrap{
    position:relative;
    flex:1;
    background:#E4D9CC;
    overflow:hidden;
  }
  .photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.5s ease;
  }
  .card-frame:hover .photo-wrap img{
    transform:scale(1.03);
  }

  .sku-tag{
    position:absolute;
    top:12px;
    left:12px;
    background:rgba(251,248,242,0.92);
    color:var(--terracotta-deep);
    font-size:9px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    padding:4px 9px;
    border-radius:999px;
    border:1px solid rgba(138,63,40,0.18);
    z-index:2;
    backdrop-filter:blur(4px);
  }

  .front-info{
    padding:12px 14px 14px;
    background:var(--card-surface);
    border-top:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .product-name{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:17px;
    line-height:1.2;
    color:var(--ink);
  }
  .tagline{
    font-size:11.5px;
    color:var(--ink-muted);
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .meta-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:4px;
    padding-top:4px;
    border-top:1px dashed var(--line);
    gap:6px;
  }
  .price{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:500;
    color:var(--terracotta-deep);
    white-space:nowrap;
  }
  .price span{
    font-size:10.5px;
    font-weight:400;
    color:var(--ink-muted);
    margin-left:2px;
  }
  
  .card-actions{
    display:flex;
    align-items:center;
    gap:6px;
  }
  
  .wa-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--wa-green);
    color:#FFFFFF;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:4px 8px;
    border-radius:999px;
    text-decoration:none;
    transition:all 0.2s;
    box-shadow:0 2px 6px rgba(37,211,102,0.3);
    white-space:nowrap;
  }
  .wa-btn:hover{
    background:var(--wa-green-hover);
    transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(37,211,102,0.4);
  }
  .wa-btn svg{
    width:11px;
    height:11px;
    fill:currentColor;
  }

  .flip-hint{
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--terracotta-deep);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:3px;
    background:var(--terracotta-pale);
    padding:3.5px 7px;
    border-radius:999px;
    white-space:nowrap;
  }

  /* Back Face */
  .card-back{
    transform:rotateY(180deg);
    display:flex;
    flex-direction:column;
    padding:18px 16px;
    background:var(--card-back-bg);
  }
  .back-eyebrow{
    font-size:9px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--back-text-muted);
    margin-bottom:4px;
  }
  .back-title{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:500;
    margin-bottom:8px;
    color:var(--back-text);
    line-height:1.25;
  }
  .story{
    font-size:12px;
    line-height:1.5;
    color:var(--back-text);
    margin-bottom:auto;
    overflow-y:auto;
    padding-right:4px;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,0.3) transparent;
  }
  .story::-webkit-scrollbar{width:4px;}
  .story::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:4px;}

  .size-prices{
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid var(--back-line);
  }
  .size-prices-title{
    margin-bottom:4px;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--back-text-muted);
  }
  .size-price-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:3px 0;
    font-size:11px;
    color:var(--back-text);
  }
  .size-price-row + .size-price-row{
    border-top:1px solid rgba(255,255,255,0.12);
  }
  .size-price-value{font-weight:600;white-space:nowrap;}

  .spec-list{
    border-top:1px solid var(--back-line);
    margin-top:10px;
    padding-top:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .spec-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:11px;
  }
  .spec-label{color:var(--back-text-muted);white-space:nowrap;}
  .spec-value{font-weight:500;text-align:right;color:var(--back-text);}

  .back-footer{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid var(--back-line);
    padding-top:8px;
    gap:6px;
  }
  .back-price{
    font-family:'Fraunces',serif;
    font-size:14px;
    color:var(--back-text);
    white-space:nowrap;
  }
  .back-actions{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .flip-back-btn{
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--back-text);
    background:rgba(255,255,255,0.15);
    padding:3.5px 8px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.25);
    cursor:pointer;
    white-space:nowrap;
  }

  /* Empty State */
  .empty-state{
    grid-column:1 / -1;
    text-align:center;
    padding:60px 20px;
    color:var(--back-text-muted);
  }
  .empty-state h3{
    font-family:'Fraunces',serif;
    font-size:20px;
    color:var(--back-text);
    margin-bottom:8px;
  }

  /* Back to Top */
  .back-to-top{
    position:fixed;
    bottom:24px;
    right:24px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--terracotta-pale);
    color:var(--terracotta-deep);
    border:1px solid rgba(138,63,40,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,0.3);
    opacity:0;
    visibility:hidden;
    transition:all 0.3s;
    z-index:90;
  }
  .back-to-top.visible{
    opacity:1;
    visibility:visible;
  }

  /* Responsive breakpoints */
  @media (max-width: 1320px){
    .product-grid{ grid-template-columns:repeat(4, 1fr); gap:16px; }
  }
  @media (max-width: 1024px){
    .product-grid{ grid-template-columns:repeat(3, 1fr); gap:14px; }
  }
  @media (max-width: 768px){
    .product-grid{ grid-template-columns:repeat(2, 1fr); gap:12px; }
  }
  @media (max-width: 640px){
    .sticky-header{padding:12px 14px;}
    .brand-title{font-size:19px;}
    .search-wrap{max-width:100%;order:3;width:100%;margin-top:6px;}
    .product-grid{grid-template-columns:repeat(2, 1fr); gap:10px;}
    .card-frame{aspect-ratio:3/4.6;}
    .front-info{padding:10px 10px 12px;}
    .product-name{font-size:14px; line-height:1.25;}
    .tagline{font-size:10px;}
    .meta-row{display:flex; align-items:center; justify-content:space-between; gap:4px; margin-top:4px; padding-top:4px;}
    .price{font-size:12.5px;}
    .price span{font-size:9px;}
    .card-actions{display:flex; align-items:center;}
    .wa-btn{font-size:9px; padding:4.5px 9px; border-radius:999px;}
    .wa-btn svg{width:11px; height:11px;}
    .flip-hint, .flip-back-btn{display:none !important;} /* In mobile view, WhatsApp link is given alone */
    .card-back{padding:12px 10px;}
    .back-title{font-size:14px;}
    .story{font-size:11px;}
  }
  @media (max-width: 420px){
    .grid-stage{padding:16px 10px 60px;}
    .product-grid{gap:8px;}
    .product-name{font-size:13px;}
    .price{font-size:11.5px;}
    .wa-btn{font-size:8.5px; padding:4px 7px;}
  }
</style>
</head>
<body>

</header>

<div class="grid-stage">
  <div class="product-grid" id="productGrid"></div>
</div>

<button class="back-to-top" id="backToTop" title="Back to top">↑</button>

const WA_PHONE = '918300433543';

function formatPrice(p) {
  if (!p) return '';
  return p.toLowerCase().includes('request') ? p : '₹' + p;
}

function getWhatsAppUrl(p) {
  const priceText = formatPrice(p.price);
  const msg = `Hi, I am interested in ${p.name} (SKU: ${p.sku}) - Price: ${priceText}`;
  return `https://wa.me/${WA_PHONE}?text=${encodeURIComponent(msg)}`;
}

function createCardElement(p, index) {
  const frame = document.createElement('div');
  frame.className = 'card-frame';
  frame.dataset.index = index;

  const waUrl = getWhatsAppUrl(p);

  const sizePricesHtml = (Array.isArray(p.sizePrices) && p.sizePrices.length) ? `
    <div class="size-prices">
      <div class="size-prices-title">Available Sizes &amp; Prices</div>
      ${p.sizePrices.map((sp) => {
        const sz = Array.isArray(sp) ? sp[0] : (sp.size || '');
        const pr = Array.isArray(sp) ? sp[1] : (sp.price || '');
        return `
        <div class="size-price-row">
          <span>${sz}</span>
          <span class="size-price-value">${formatPrice(pr)}</span>
        </div>
      `;
      }).join('')}
    </div>
  ` : '';

  const dimsHtml = p.dimensions ? `
    <div class="spec-row">
      <span class="spec-label">Dimensions</span>
      <span class="spec-value">${p.dimensions}</span>
    </div>
  ` : '';

  const waSvgIcon = `<svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.84 9.84 0 0 0 12.04 2zm.01 1.67c4.54 0 8.24 3.7 8.24 8.24 0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.91-.4-4.16-1.15l-.3-.18-3.1.81.83-3.02-.2-.32a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24zm-3.53 4.52c-.19 0-.5.07-.76.36-.26.29-1 1-1 2.44 0 1.44 1.03 2.83 1.17 3.03.14.19 2.03 3.1 4.93 4.35.69.3 1.23.48 1.65.61.69.22 1.32.19 1.81.12.55-.08 1.7-.7 1.94-1.37.24-.67.24-1.25.17-1.37-.07-.12-.26-.19-.55-.34-.29-.14-1.7-.84-1.96-.94-.26-.1-.45-.14-.64.14-.19.29-.74.94-.91 1.13-.17.19-.34.22-.63.07-.29-.14-1.22-.45-2.33-1.44-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.59.13-.13.29-.34.43-.51.14-.17.19-.29.29-.48.1-.19.05-.36-.02-.5-.07-.14-.64-1.54-.88-2.11-.23-.55-.47-.48-.64-.49z"/></svg>`;

  frame.innerHTML = `
    <div class="card-inner">
      <!-- FRONT -->
      <div class="card-face card-front">
        <div class="photo-wrap">
          <span class="sku-tag">${p.sku}</span>
          <img src="${p.image}" alt="${p.name}" loading="lazy">
        </div>
        <div class="front-info">
          <div class="product-name">${p.name}</div>
          <div class="tagline">${p.tagline || ''}</div>
          <div class="meta-row">
            <div class="price">${formatPrice(p.price)}${p.price && !p.price.toLowerCase().includes('request') ? ' <span>onwards</span>' : ''}</div>
            <div class="card-actions">
              <a href="${waUrl}" target="_blank" rel="noopener" class="wa-btn" onclick="event.stopPropagation()" title="Inquire on WhatsApp">
                ${waSvgIcon}
                Inquire
              </a>
              <div class="flip-hint">Story ↻</div>
            </div>
          </div>
        </div>
      </div>

      <!-- BACK -->
      <div class="card-face card-back">
        <div class="back-eyebrow">The Story • ${p.sku}</div>
        <div class="back-title">${p.name}</div>
        <div class="story">${p.story || ''}</div>
        ${sizePricesHtml}
        <div class="spec-list">
          ${dimsHtml}
        </div>
        <div class="back-footer">
          <div class="back-price">${formatPrice(p.price)}</div>
          <div class="back-actions">
            <a href="${waUrl}" target="_blank" rel="noopener" class="wa-btn" onclick="event.stopPropagation()" title="Inquire on WhatsApp">
              ${waSvgIcon}
              WhatsApp
            </a>
            <div class="flip-back-btn">Front ↻</div>
          </div>
        </div>
      </div>
    </div>
  `;

  frame.addEventListener('click', function(e) {
    this.classList.toggle('flipped');
  });

  return frame;
}

function renderGrid(items) {
  const grid = document.getElementById('productGrid');
  const counter = document.getElementById('counterBadge');
  grid.replaceChildren();

  if (items.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <h3>No matching products</h3>
        <p>Try searching for another keyword or SKU.</p>
      </div>
    `;
    counter.textContent = '0 Products';
    return;
  }

  counter.textContent = `${items.length} Product${items.length === 1 ? '' : 's'}`;
  items.forEach((p, idx) => {
    grid.appendChild(createCardElement(p, idx));
  });
}

let activeProducts = typeof PRODUCTS !== 'undefined' ? PRODUCTS : [];

// Live Search
document.getElementById('searchInput').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase().trim();
  if (!q) {
    renderGrid(activeProducts);
    return;
  }
  const filtered = activeProducts.filter(p => 
    (p.name && p.name.toLowerCase().includes(q)) ||
    (p.sku && p.sku.toLowerCase().includes(q)) ||
    (p.tagline && p.tagline.toLowerCase().includes(q)) ||
    (p.story && p.story.toLowerCase().includes(q)) ||
    (p.dimensions && p.dimensions.toLowerCase().includes(q))
  );
  renderGrid(filtered);
});

// Back to top button
const backToTopBtn = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  if (window.scrollY > 400) {
    backToTopBtn.classList.add('visible');
  } else {
    backToTopBtn.classList.remove('visible');
  }
});
backToTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Initial Render & Dynamic CMS Fetch
renderGrid(activeProducts);

fetch('content/products.json?t=' + Date.now(), { cache: 'no-store' })
  .then(res => res.ok ? res.json() : null)
  .then(data => {
    if (Array.isArray(data) && data.length > 0) {
      activeProducts = data;
      renderGrid(activeProducts);
    }
  })
  .catch(err => console.log('Loaded static products'));
</script>
